<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Spiral Helix Down 🌀</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; touch-action:manipulation; }
body { margin: 0; overflow: hidden; background: #090032; font-family: sans-serif; }
canvas { display: block; width: 100vw; height: 100vh; }
#hud { position: fixed; top: 0; left: 0; right: 0; padding: 15px; display: flex; justify-content: space-between; background: rgba(0,0,0,0.4); z-index: 10; color: white; }
.stat { text-align: center; }
.stat-val { font-size: 24px; font-weight: 900; color: #a78bfa; }
.stat-lbl { font-size: 10px; opacity: 0.6; }

#screen-start, #screen-over {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(9, 0, 50, 0.95);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 30px; text-align: center; color: white;
}
.hidden { display: none !important; }
.btn {
  background: #a78bfa; color: #090032; border: none; padding: 18px 50px;
  border-radius: 50px; font-size: 18px; font-weight: 900; cursor: pointer;
  margin-top: 25px; box-shadow: 0 5px 15px rgba(167, 139, 250, 0.4);
}
</style>
<script src="admob.js"></script>
</head>
<body>

<div id="hud">
  <div class="stat"><span class="stat-lbl" id="lbl-best">BEST</span><br><span class="stat-val" id="best">0</span></div>
  <div class="stat"><span class="stat-lbl" id="lbl-score">SCORE</span><br><span class="stat-val" id="score">0</span></div>
</div>

<canvas id="canvas"></canvas>

<div id="screen-start">
  <div style="font-size: 80px">🌀</div>
  <h1 id="start-title">Helix Jump</h1>
  <p id="start-desc">Spiral bo'shliqlaridan o'tib, pastga tushing!</p>
  <button class="btn" onclick="startGame()" id="btn-start">START</button>
</div>

<div id="screen-over" class="hidden">
  <h1 id="over-title">GAME OVER</h1>
  <div style="font-size: 60px; margin: 20px 0; color: #a78bfa" id="final-score">0</div>
  <button class="btn" onclick="startGame()" id="btn-again">TRY AGAIN</button>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const LANG = (params.get('lang') || 'uz').toLowerCase();
const I18N = {
  uz: { best:"REKORD", score:"BALL", start:"Helix Jump", desc:"Teshiklardan tushib, eng pastga yetib boring!", btnStart:"BOSHLASH", btnAgain:"QAYTA O'YNASH", over:"O'yin Tugadi" },
  ru: { best:"РЕКОРД", score:"СЧЕТ", start:"Хеликс Джамп", desc:"Прыгай вниз через пустые сектора!", btnStart:"СТАРТ", btnAgain:"ЗАНОВО", over:"Игра Окончена" },
  en: { best:"BEST", score:"SCORE", start:"Helix Jump", desc:"Jump down through the gaps!", btnStart:"START", btnAgain:"PLAY AGAIN", over:"Game Over" }
};
const t = I18N[LANG] || I18N.en;

document.getElementById('lbl-best').textContent = t.best;
document.getElementById('lbl-score').textContent = t.score;
document.getElementById('start-title').textContent = t.start;
document.getElementById('start-desc').textContent = t.desc;
document.getElementById('btn-start').textContent = t.btnStart;
document.getElementById('btn-again').textContent = t.btnAgain;
document.getElementById('over-title').textContent = t.over;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let score = 0, rotation = 0, ballY = 150, ballVY = 0, platforms = [], gameOver = true;
let best = parseInt(localStorage.getItem('gz-best-helix-jump') || '0');
document.getElementById('best').textContent = best;
const gravity = 0.3, jumpForce = -7.5;

function startGame() {
  score = 0; rotation = 0; ballY = 150; ballVY = 0; gameOver = false;
  document.getElementById('score').textContent = "0";
  document.getElementById('screen-start').classList.add('hidden');
  document.getElementById('screen-over').classList.add('hidden');
  initPlatforms();
  requestAnimationFrame(loop);
}

function initPlatforms() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  platforms = [];
  for (let i = 0; i < 50; i++) {
    platforms.push({
      y: 400 + i * 200,
      gap: Math.random() * Math.PI * 2,
      color: `hsl(${(i * 50) % 360}, 75%, 60%)`
    });
  }
}

function loop() {
  if (gameOver) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Center Column
  ctx.fillStyle = "#1a1a4a";
  ctx.fillRect(canvas.width / 2 - 25, 0, 50, canvas.height);

  const camY = ballY - 150;
  platforms.forEach((p, idx) => {
    const screenY = p.y - camY;
    if (screenY < -100 || screenY > canvas.height + 100) return;

    ctx.save();
    ctx.translate(canvas.width / 2, screenY);
    ctx.rotate(rotation);

    for (let a = 0; a < Math.PI * 2; a += 0.3) {
      const isGap = Math.abs(a - p.gap) < 0.6;
      if (!isGap) {
        ctx.beginPath();
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 18;
        ctx.arc(0, 0, 110, a, a + 0.35);
        ctx.stroke();
      }
    }
    ctx.restore();

    // Collision
    if (Math.abs(ballY - p.y) < 12 && ballVY > 0) {
      const angle = ((-rotation) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
      const diff = Math.abs(angle - p.gap);
      if (diff < 0.5 || diff > Math.PI * 2 - 0.5) { /* Pass */ }
      else { ballVY = jumpForce; ballY = p.y - 12; }
    }
    if (ballY > p.y + 20 && idx >= score) {
      score = idx + 1;
      document.getElementById('score').textContent = score;
    }
  });

  ballVY += gravity;
  ballY += ballVY;
  ctx.fillStyle = "white";
  ctx.beginPath();
  ctx.arc(canvas.width / 2, 150, 14, 0, Math.PI * 2);
  ctx.fill();

  if (ballY > platforms[platforms.length - 1].y + 400) endGame();
  requestAnimationFrame(loop);
}

function endGame() {
  gameOver = true;
  document.getElementById('final-score').textContent = score;
  document.getElementById('screen-over').classList.remove('hidden');
  if (score > best) {
    best = score;
    localStorage.setItem('gz-best-helix-jump', best);
    document.getElementById('best').textContent = best;
  }
  window.parent.postMessage({ type: "game:score", id: "helix-jump", score: score }, "*");
  window.parent.__gameEnd?.();
}

let lastX = 0;
window.addEventListener('touchstart', e => lastX = e.touches[0].clientX);
window.addEventListener('touchmove', e => {
  const dx = e.touches[0].clientX - lastX;
  rotation += dx * 0.015;
  lastX = e.touches[0].clientX;
});
window.addEventListener('mousedown', e => lastX = e.clientX);
window.addEventListener('mousemove', e => { if (e.buttons === 1) { rotation += (e.clientX - lastX) * 0.015; lastX = e.clientX; } });
</script>
</body>
</html>
