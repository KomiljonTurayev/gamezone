<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Star Catcher Pro ⭐</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; touch-action:none; }
body {
  min-height: 100vh;
  background: radial-gradient(circle at center, #1a1a3a 0%, #0c0a24 100%);
  font-family: 'Segoe UI', Roboto, sans-serif;
  overflow: hidden;
  color: white;
}
canvas { display: block; width: 100%; height: 100vh; cursor: crosshair; }

#hud {
  position: fixed; top: 0; left: 0; right: 0;
  padding: 20px; display: flex; justify-content: space-between;
  pointer-events: none; z-index: 10;
}
.stat { text-align: center; }
.stat-val { font-size: 28px; font-weight: 900; color: #fbbf24; text-shadow: 0 0 10px rgba(251, 191, 36, 0.5); }
.stat-lbl { font-size: 10px; opacity: 0.6; letter-spacing: 1px; text-transform: uppercase; }

#screens { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; }
.screen {
  background: rgba(12, 10, 36, 0.95);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 40px; text-align: center; border-radius: 35px;
  border: 2px solid #fbbf24; box-shadow: 0 0 40px rgba(251, 191, 36, 0.2);
  max-width: 85%;
}
.hidden { display: none !important; }
.btn {
  background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #0c0a24; border: none; padding: 18px 50px;
  border-radius: 50px; font-size: 18px; font-weight: 900; cursor: pointer;
  margin-top: 25px; box-shadow: 0 8px 20px rgba(251, 191, 36, 0.3);
  transition: transform 0.1s;
}
.btn:active { transform: scale(0.95); }
</style>
<script src="game-api.js"></script>
</head>
<body>

<div id="hud">
  <div class="stat"><span class="stat-lbl" id="lbl-best">BEST</span><br><span class="stat-val" id="best">0</span></div>
  <div class="stat"><span class="stat-lbl" id="lbl-score">SCORE</span><br><span class="stat-val" id="score">0</span></div>
  <div class="stat"><span class="stat-lbl" id="lbl-time">TIME</span><br><span class="stat-val" id="timer">30</span></div>
</div>

<canvas id="game"></canvas>

<div id="screens">
  <div class="screen" id="screen-start">
    <div style="font-size: 70px; margin-bottom: 10px;">⭐</div>
    <h1 id="start-title">Star Catcher</h1>
    <p id="start-desc" style="opacity: 0.8; margin-top: 10px;">Yulduzlarni savat bilan tutib oling!</p>
    <button class="btn" onclick="startGame()" id="btn-start">START</button>
  </div>

  <div class="screen hidden" id="screen-over">
    <h1 id="over-title">O'yin Tugadi</h1>
    <div style="font-size: 56px; margin: 25px 0; color: #fbbf24; font-weight: 900;" id="final-score">0</div>
    <button class="btn" onclick="startGame()" id="btn-again">PLAY AGAIN</button>
  </div>
</div>

<script>
const GAME_ID = 'star-catcher';
const I18N = {
  uz: { best:"REKORD", score:"BALL", time:"VAQT", start:"Yulduzlar!", desc:"Yulduzlarni savat bilan tutib oling!", btnStart:"BOSHLASH", btnAgain:"QAYTA", over:"O'yin Tugadi" },
  ru: { best:"РЕКОРД", score:"СЧЕТ", time:"ВРЕМЯ", start:"Звезды!", desc:"Лови падающие звезды в корзину!", btnStart:"СТАРТ", btnAgain:"ЗАНОВО", over:"Игра Окончена" },
  en: { best:"BEST", score:"SCORE", time:"TIME", start:"Stars!", desc:"Catch the falling stars with your basket!", btnStart:"START", btnAgain:"AGAIN", over:"Game Over" }
};
const t = GameAPI.t.bind(GameAPI, I18N);

function setupUI() {
  document.getElementById('lbl-best').textContent = t('best');
  document.getElementById('lbl-score').textContent = t('score');
  document.getElementById('lbl-time').textContent = t('time');
  document.getElementById('start-title').textContent = t('start');
  document.getElementById('start-desc').textContent = t('desc');
  document.getElementById('btn-start').textContent = t('btnStart');
  document.getElementById('btn-again').textContent = t('btnAgain');
  document.getElementById('over-title').textContent = t('over');
}

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let score = 0, timeLeft = 30, gameActive = false;
let best = GameAPI.getBestScore(GAME_ID);
document.getElementById('best').textContent = best;

let basket = { x: 0, w: 100, h: 25 };
let stars = [], particles = [];
let timerInterval;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  basket.x = canvas.width / 2 - basket.w / 2;
}
window.addEventListener('resize', resize);
resize();

function spawnParticle(x, y) {
  for(let i=0; i<8; i++) {
    particles.push({
      x, y,
      vx: (Math.random()-0.5)*10,
      vy: (Math.random()-0.5)*10,
      life: 1,
      color: '#fbbf24'
    });
  }
}

function startGame() {
  score = 0; timeLeft = 30 * GameAPI.profile.timer; gameActive = true; stars = []; particles = [];
  document.getElementById('score').textContent = "0";
  document.getElementById('screen-start').classList.add('hidden');
  document.getElementById('screen-over').classList.add('hidden');

  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    document.getElementById('timer').textContent = Math.max(0, Math.ceil(timeLeft));
    if (timeLeft <= 0) endGame();
  }, 1000);

  requestAnimationFrame(update);
}

function endGame() {
  gameActive = false;
  clearInterval(timerInterval);
  document.getElementById('final-score').textContent = score;
  document.getElementById('screen-over').classList.remove('hidden');
  GameAPI.saveBestScore(GAME_ID, score);
  best = GameAPI.getBestScore(GAME_ID);
  document.getElementById('best').textContent = best;
  GameAPI.reportScore(GAME_ID, score);
  GameAPI.endGame();
}

function update() {
  if (!gameActive) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Basket
  ctx.fillStyle = "#3b82f6";
  ctx.shadowBlur = 15; ctx.shadowColor = "#3b82f6";
  ctx.beginPath();
  ctx.roundRect(basket.x, canvas.height - 100, basket.w, basket.h, 10);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Stars
  if (Math.random() < 0.04) {
    stars.push({ x: Math.random() * (canvas.width - 40), y: -40, s: (2 + Math.random() * 3) * GameAPI.profile.speed });
  }

  stars.forEach((s, idx) => {
    s.y += s.s;
    ctx.font = "34px Arial";
    ctx.fillText("⭐", s.x, s.y);

    if (s.y > canvas.height - 100 && s.y < canvas.height - 60 && s.x + 25 > basket.x && s.x < basket.x + basket.w) {
      score += 10;
      document.getElementById('score').textContent = score;
      spawnParticle(s.x + 15, s.y);
      GameAPI.vibrate(15);
      stars.splice(idx, 1);
    } else if (s.y > canvas.height) {
      stars.splice(idx, 1);
    }
  });

  // Particles
  particles.forEach((p, idx) => {
    p.x += p.vx; p.y += p.vy; p.life -= 0.02;
    if(p.life <= 0) particles.splice(idx, 1);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life;
    ctx.fillRect(p.x, p.y, 4, 4);
    ctx.globalAlpha = 1;
  });

  requestAnimationFrame(update);
}

const move = (e) => {
  const x = e.touches ? e.touches[0].clientX : e.clientX;
  basket.x = x - basket.w / 2;
  if (basket.x < 0) basket.x = 0;
  if (basket.x > canvas.width - basket.w) basket.x = canvas.width - basket.w;
};
canvas.addEventListener('touchmove', (e) => { e.preventDefault(); move(e); }, { passive: false });
canvas.addEventListener('mousemove', move);

setupUI();
</script>
</body>
</html>
