<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Star Catcher Safari ⭐</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; touch-action:manipulation; }
body {
  min-height: 100vh;
  background: #0c0a24;
  font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
  overflow: hidden;
  color: white;
}
canvas { display: block; width: 100%; height: 100vh; cursor: crosshair; }

#hud {
  position: fixed; top: 0; left: 0; right: 0;
  padding: 15px; display: flex; justify-content: space-between;
  background: rgba(0,0,0,0.4); pointer-events: none;
}
.stat { text-align: center; }
.stat-val { font-size: 24px; font-weight: 900; color: #fbbf24; }
.stat-lbl { font-size: 10px; opacity: 0.6; }

#screen-start, #screen-over {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(12, 10, 36, 0.95);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 30px; text-align: center;
}
.hidden { display: none !important; }
.btn {
  background: #fbbf24; color: #0c0a24; border: none; padding: 18px 50px;
  border-radius: 50px; font-size: 18px; font-weight: 900; cursor: pointer;
  margin-top: 25px; box-shadow: 0 5px 15px rgba(251, 191, 36, 0.4);
}
</style>
<script src="admob.js"></script>
</head>
<body>

<div id="hud">
  <div class="stat"><span class="stat-lbl" id="lbl-best">BEST</span><br><span class="stat-val" id="best">0</span></div>
  <div class="stat"><span class="stat-lbl" id="lbl-score">SCORE</span><br><span class="stat-val" id="score">0</span></div>
  <div class="stat"><span class="stat-lbl" id="lbl-time">TIME</span><br><span class="stat-val" id="timer">30</span></div>
</div>

<canvas id="game"></canvas>

<div id="screen-start">
  <div style="font-size: 80px">⭐</div>
  <h1 id="start-title">Star Catcher</h1>
  <p id="start-desc">Savatni harakatlantiring va yulduzlarni tuting!</p>
  <button class="btn" onclick="startGame()" id="btn-start">START</button>
</div>

<div id="screen-over" class="hidden">
  <h1 id="over-title">O'yin Tugadi</h1>
  <div style="font-size: 60px; margin: 20px 0; color: #fbbf24" id="final-score">0</div>
  <button class="btn" onclick="startGame()" id="btn-again">PLAY AGAIN</button>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const LANG = (params.get('lang') || 'uz').toLowerCase();
const I18N = {
  uz: { best:"REKORD", score:"BALL", time:"VAQT", start:"Star Catcher", desc:"Yulduzlarni savat bilan tutib oling!", btnStart:"BOSHLASH", btnAgain:"QAYTA O'YNASH", over:"O'yin Tugadi" },
  ru: { best:"РЕКОРД", score:"СЧЕТ", time:"ВРЕМЯ", start:"Ловец Звезд", desc:"Лови падающие звезды в корзину!", btnStart:"СТАРТ", btnAgain:"ЗАНОВО", over:"Игра Окончена" },
  en: { best:"BEST", score:"SCORE", time:"TIME", start:"Star Catcher", desc:"Catch the falling stars with your basket!", btnStart:"START", btnAgain:"PLAY AGAIN", over:"Game Over" }
};
const t = I18N[LANG] || I18N.en;

document.getElementById('lbl-best').textContent = t.best;
document.getElementById('lbl-score').textContent = t.score;
document.getElementById('lbl-time').textContent = t.time;
document.getElementById('start-title').textContent = t.start;
document.getElementById('start-desc').textContent = t.desc;
document.getElementById('btn-start').textContent = t.btnStart;
document.getElementById('btn-again').textContent = t.btnAgain;
document.getElementById('over-title').textContent = t.over;

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let score = 0, timeLeft = 30, gameActive = false;
let best = parseInt(localStorage.getItem('gz-best-star-catcher') || '0');
document.getElementById('best').textContent = best;

let basket = { x: 0, w: 100, h: 40 };
let stars = [];
let timerInterval;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  basket.x = canvas.width / 2 - basket.w / 2;
}
window.addEventListener('resize', resize);
resize();

function startGame() {
  score = 0; timeLeft = 30; gameActive = true; stars = [];
  document.getElementById('score').textContent = "0";
  document.getElementById('screen-start').classList.add('hidden');
  document.getElementById('screen-over').classList.add('hidden');

  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    document.getElementById('timer').textContent = timeLeft;
    if (timeLeft <= 0) endGame();
  }, 1000);

  requestAnimationFrame(update);
}

function endGame() {
  gameActive = false;
  clearInterval(timerInterval);
  document.getElementById('final-score').textContent = score;
  document.getElementById('screen-over').classList.remove('hidden');
  if (score > best) {
    best = score;
    localStorage.setItem('gz-best-star-catcher', best);
    document.getElementById('best').textContent = best;
  }
  window.parent.postMessage({ type: "game:score", id: "star-catcher", score: score }, "*");
  window.parent.__gameEnd?.();
}

function update() {
  if (!gameActive) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Background stars
  ctx.fillStyle = "rgba(255,255,255,0.1)";
  for(let i=0; i<50; i++) {
    ctx.beginPath();
    ctx.arc((i*137)%canvas.width, (i*97)%canvas.height, 1, 0, Math.PI*2);
    ctx.fill();
  }

  // Draw Basket
  ctx.fillStyle = "#3b82f6";
  ctx.beginPath();
  ctx.roundRect(basket.x, canvas.height - 80, basket.w, basket.h, 10);
  ctx.fill();
  ctx.strokeStyle = "white"; ctx.stroke();

  // Spawn stars
  if (Math.random() < 0.05) {
    stars.push({ x: Math.random() * (canvas.width - 30), y: -30, s: 2 + Math.random() * 3 });
  }

  // Update & Draw stars
  stars.forEach((s, idx) => {
    s.y += s.s;

    // Draw Star
    ctx.fillStyle = "#fbbf24";
    ctx.font = "30px Arial";
    ctx.fillText("⭐", s.x, s.y);

    // Collision
    if (s.y > canvas.height - 80 && s.y < canvas.height - 40 && s.x + 20 > basket.x && s.x < basket.x + basket.w) {
      score += 10;
      document.getElementById('score').textContent = score;
      stars.splice(idx, 1);
    } else if (s.y > canvas.height) {
      stars.splice(idx, 1);
    }
  });

  requestAnimationFrame(update);
}

// Controls
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  basket.x = e.touches[0].clientX - basket.w / 2;
  if (basket.x < 0) basket.x = 0;
  if (basket.x > canvas.width - basket.w) basket.x = canvas.width - basket.w;
});

canvas.addEventListener('mousemove', (e) => {
  basket.x = e.clientX - basket.w / 2;
  if (basket.x < 0) basket.x = 0;
  if (basket.x > canvas.width - basket.w) basket.x = canvas.width - basket.w;
});

</script>
</body>
</html>
