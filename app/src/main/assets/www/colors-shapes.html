<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ranglar va Shakllar 🎨</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; touch-action:manipulation; }

body {
  min-height: 100vh;
  background: #FFF9F0;
  font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
  overflow: hidden;
  user-select: none;
}

/* RAINBOW TOP */
#rainbow {
  height: 8px;
  background: linear-gradient(90deg, #FF6B6B,#FF9F43,#FECA57,#48DBFB,#1DD1A1,#5F27CD);
}

#app {
  display: flex; flex-direction: column;
  align-items: center;
  min-height: calc(100vh - 8px);
  padding-bottom: 70px;
}

/* TOP BAR */
#topbar {
  width: 100%; max-width: 480px;
  padding: 12px 16px;
  display: flex; justify-content: space-between; align-items: center;
}

.badge {
  background: white;
  border-radius: 20px;
  padding: 8px 16px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.1);
  text-align: center;
}
.badge-label { color: #999; font-size: 10px; letter-spacing: 1px; }
.badge-val   { color: #2D3436; font-size: 20px; font-weight: 900; }

/* MODE TABS */
#mode-tabs {
  display: flex; gap: 8px;
  padding: 0 16px;
  margin-bottom: 12px;
}
.tab {
  flex: 1; border: none; border-radius: 16px;
  padding: 10px 6px; font-size: 13px; font-weight: bold;
  cursor: pointer; transition: all 0.15s;
  color: #666; background: white;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.tab.active {
  color: white;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
}
.tab:active { transform: scale(0.96); }

/* QUESTION */
#q-section {
  width: 100%; max-width: 480px;
  padding: 0 16px 12px;
}

#q-card {
  background: white;
  border-radius: 28px;
  padding: 20px;
  box-shadow: 0 6px 24px rgba(0,0,0,0.08);
  text-align: center;
  transition: background 0.3s;
}

#q-instruction {
  font-size: 13px;
  color: #888;
  letter-spacing: 1px;
  margin-bottom: 12px;
}

#q-target {
  font-size: 80px;
  line-height: 1;
  margin: 8px 0;
}

#q-target-shape {
  margin: 8px auto;
  transition: all 0.3s;
}

#q-name {
  font-size: 24px;
  font-weight: 900;
  margin-top: 8px;
}
#q-hint {
  font-size: 13px;
  color: #aaa;
  margin-top: 4px;
}

/* CHOICES GRID */
#choices-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  width: 100%; max-width: 480px;
  padding: 0 16px;
}

.choice {
  background: white;
  border: 3px solid transparent;
  border-radius: 22px;
  padding: 18px 8px;
  cursor: pointer;
  transition: all 0.12s;
  box-shadow: 0 4px 14px rgba(0,0,0,0.08);
  display: flex; flex-direction: column;
  align-items: center; gap: 8px;
}
.choice:active { transform: scale(0.93); }
.choice-label {
  font-size: 13px;
  font-weight: bold;
  color: #555;
}
.choice.correct { background: #D1FAE5; border-color: #10B981; }
.choice.wrong   { background: #FEE2E2; border-color: #EF4444; }

/* SVG SHAPES */
.shape-svg { width: 56px; height: 56px; }

/* PROGRESS BAR */
#prog-outer {
  width: 90%; max-width: 420px;
  height: 10px;
  background: #F0F0F0;
  border-radius: 10px;
  overflow: hidden;
  margin: 10px auto 0;
}
#prog-inner {
  height: 100%;
  border-radius: 10px;
  background: linear-gradient(90deg, #FECA57, #FF6B6B);
  transition: width 0.3s ease;
}

/* ADMOB */
#admob {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: 56px;
  background: #fff;
  border-top: 1px solid #eee;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; color: #bbb;
  z-index: 10;
}

/* SCREENS */
.screen {
  position: fixed; inset: 0; z-index: 50;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 16px; padding: 30px;
  background: linear-gradient(160deg, #FFECD2 0%, #FCB69F 100%);
}
.hidden { display: none !important; }

.white-card {
  background: white; border-radius: 32px;
  padding: 28px 28px; text-align: center;
  width: 100%; max-width: 340px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.12);
}
.wc-title { font-size: 26px; font-weight: 900; color: #2D3436; margin: 8px 0; }
.wc-sub   { font-size: 13px; color: #636E72; line-height: 1.7; }
.wc-big   { font-size: 72px; line-height: 1; }

.action-btn {
  background: linear-gradient(135deg, #FF6B6B, #FF9F43);
  border: none; border-radius: 50px;
  padding: 18px 40px;
  color: white; font-size: 17px; font-weight: 900;
  cursor: pointer;
  box-shadow: 0 6px 24px rgba(255,107,107,0.4);
  width: 100%; max-width: 280px;
}
.ghost-btn {
  background: white; border: 2px solid #FF6B6B;
  border-radius: 50px; padding: 14px 30px;
  color: #FF6B6B; font-size: 14px; font-weight: bold;
  cursor: pointer; width: 100%; max-width: 280px;
}

/* CONFETTI */
.confetti {
  position: fixed; pointer-events: none; z-index: 80;
  font-size: 24px;
  animation: confettiFall 1.2s ease-in forwards;
}
@keyframes confettiFall {
  0%   { transform: translate(0,0) rotate(0deg); opacity: 1; }
  100% { transform: translate(var(--tx), 100vh) rotate(360deg); opacity: 0; }
}
</style>
<script src="admob.js"></script>
<script src="game-api.js"></script>
<script>
// ── DATA ─────────────────────────────────────────────────────────────────────
const GAME_ID = 'colors-shapes';
const I18N = {
  uz: { ball: "BALL", level: "DARAJA", rekord: "REKORD", color: "🎨 Ranglar", shape: "🔷 Shakllar", mix: "🌈 Aralash", find: "TOPISH KERAK", colorSuffix: " RANG", shapeHint: "Shu shaklni topib bosing 👇", colorHint: "Shu rangni topib bosing 👇", start: "BOSHLASH!", again: "QAYTA", home: "BOSH SAHIFA", winTitle: "Ajoyib!", smart: "AQLLI BOLA!", great: "ZO'R!", good: "YAXSHI URINISH!", msgSmart: "Barcha ranglar va shakllarni bilasiz! 🌟", msgGreat: "Deyarli hammasi to'g'ri! Davom eting 💪", msgGood: "Yana bir oz mashq qiling! 📚", correct: "TO'G'RI", qizil: "Qizil", kok: "Ko'k", yashil: "Yashil", sariq: "Sariq", toqSariq: "To'q sariq", binafsha: "Binafsha", pushti: "Pushti", jigarrang: "Jigarrang", doira: "Doira", kvadrat: "Kvadrat", uchburchak: "Uchburchak", yulduz: "Yulduz", yurak: "Yurak", olmoscha: "Olmoscha" },
  ru: { ball: "БАЛЛЫ", level: "УРОВЕНЬ", rekord: "РЕКОРД", color: "🎨 Цвета", shape: "🔷 Фигуры", mix: "🌈 Смешано", find: "НУЖНО НАЙТИ", colorSuffix: " ЦВЕТ", shapeHint: "Найди эту фигуру 👇", colorHint: "Найди этот цвет 👇", start: "НАЧАТЬ!", again: "ЗАНОВО", home: "ГЛАВНАЯ", winTitle: "Отлично!", smart: "УМНИЦА!", great: "СУПЕР!", good: "ХОРОШО!", msgSmart: "Ты знаешь все цвета и фигуры! 🌟", msgGreat: "Почти всё правильно! Продолжай 💪", msgGood: "Потренируйся еще немного! 📚", correct: "ВЕРНО", qizil: "Красный", kok: "Синий", yashil: "Зеленый", sariq: "Желтый", toqSariq: "Оранжевый", binafsha: "Фиолетовый", pushti: "Розовый", jigarrang: "Коричневый", doira: "Круг", kvadrat: "Квадрат", uchburchak: "Треугольник", yulduz: "Звезда", yurak: "Сердце", olmoscha: "Ромб" },
  en: { ball: "SCORE", level: "LEVEL", rekord: "BEST", color: "🎨 Colors", shape: "🔷 Shapes", mix: "🌈 Mixed", find: "MUST FIND", colorSuffix: " COLOR", shapeHint: "Find this shape 👇", colorHint: "Find this color 👇", start: "START!", again: "RESTART", home: "HOME", winTitle: "Great!", smart: "SMART KID!", great: "GREAT!", good: "GOOD TRY!", msgSmart: "You know all colors and shapes! 🌟", msgGreat: "Almost all correct! Keep it up 💪", msgGood: "Practice a bit more! 📚", correct: "CORRECT", qizil: "Red", kok: "Blue", yashil: "Green", sariq: "Yellow", toqSariq: "Orange", binafsha: "Purple", pushti: "Pink", jigarrang: "Brown", doira: "Circle", kvadrat: "Square", uchburchak: "Triangle", yulduz: "Star", yurak: "Heart", olmoscha: "Diamond" }
};

const t = GameAPI.t.bind(GameAPI, I18N);

const COLORS_DATA = [
  { get name() { return t('qizil'); },     emoji: "🔴", hex: "#FF6B6B", light: "#FFE5E5" },
  { get name() { return t('kok'); },      emoji: "🔵", hex: "#4ECDC4", light: "#E0FAF8" },
  { get name() { return t('yashil'); },    emoji: "🟢", hex: "#55EFC4", light: "#E0FAF0" },
  { get name() { return t('sariq'); },     emoji: "🟡", hex: "#FECA57", light: "#FFFBE0" },
  { get name() { return t('toqSariq'); },  emoji: "🟠", hex: "#FF9F43", light: "#FFF0D9" },
  { get name() { return t('binafsha'); },  emoji: "🟣", hex: "#A29BFE", light: "#F0EEFF" },
  { get name() { return t('pushti'); },    emoji: "🩷", hex: "#FD79A8", light: "#FFE5F0" },
  { get name() { return t('jigarrang'); }, emoji: "🟤", hex: "#CD853F", light: "#F5E6D0" },
];

const SHAPES_DATA = [
  { get name() { return t('doira'); },        type: "circle" },
  { get name() { return t('kvadrat'); },      type: "square" },
  { get name() { return t('uchburchak'); },   type: "triangle" },
  { get name() { return t('yulduz'); },       type: "star" },
  { get name() { return t('yurak'); },        type: "heart" },
  { get name() { return t('olmoscha'); },     type: "diamond" },
];

function applyTranslations() {
  document.querySelectorAll('.badge-label')[0].textContent = t('ball');
  document.querySelectorAll('.badge-label')[1].textContent = t('level');
  document.querySelectorAll('.badge-label')[2].textContent = t('rekord');

  document.getElementById('tab-color').textContent = t('color');
  document.getElementById('tab-shape').textContent = t('shape');
  document.getElementById('tab-mix').textContent = t('mix');

  document.querySelector('#start-screen .wc-title').textContent = "Ranglar & Shakllar!";
  document.querySelector('#start-screen .wc-sub').innerHTML = t('msgSmart');
  document.querySelector('#start-screen .action-btn').textContent = "🎮 " + t('start');

  document.getElementById('r-title').textContent = t('winTitle');
  document.querySelectorAll('#result-screen .white-card div div div')[1].textContent = t('ball');
  document.querySelectorAll('#result-screen .white-card div div div')[3].textContent = t('correct');
  document.querySelectorAll('#result-screen .action-btn')[0].textContent = "🔄 " + t('again');
  document.querySelectorAll('#result-screen .ghost-btn')[0].textContent = "🏠 " + t('home');

  const labels = { color: t('color'), shape: t('shape'), mix: t('mix') };
  document.getElementById("mode-label").textContent = labels[gameMode];
}

window.addEventListener('DOMContentLoaded', applyTranslations);

function drawShape(svgEl, type, color, size=56) {
  svgEl.innerHTML = "";
  svgEl.setAttribute("viewBox", `0 0 ${size} ${size}`);
  const h = size/2;
  let path = "";
  if (type === "circle")   path = `<circle cx="${h}" cy="${h}" r="${h-4}" fill="${color}"/>`;
  if (type === "square")   path = `<rect x="4" y="4" width="${size-8}" height="${size-8}" rx="6" fill="${color}"/>`;
  if (type === "triangle") path = `<polygon points="${h},4 ${size-4},${size-4} 4,${size-4}" fill="${color}"/>`;
  if (type === "star") {
    const pts = [];
    for (let i=0;i<10;i++) {
      const r = i%2===0 ? h-4 : (h-4)*0.45;
      const a = (i/10)*Math.PI*2 - Math.PI/2;
      pts.push(`${h+r*Math.cos(a)},${h+r*Math.sin(a)}`);
    }
    path = `<polygon points="${pts.join(" ")}" fill="${color}"/>`;
  }
  if (type === "heart") {
    path = `<path d="M${h},${size-8} C${h},${size-8} 4,${h+4} 4,${h-4} C4,${h/2} ${h},${h/2} ${h},${h} C${h},${h/2} ${size-4},${h/2} ${size-4},${h-4} C${size-4},${h+4} ${h},${size-8} ${h},${size-8}Z" fill="${color}"/>`;
  }
  if (type === "diamond") {
    path = `<polygon points="${h},4 ${size-4},${h} ${h},${size-4} 4,${h}" fill="${color}"/>`;
  }
  svgEl.innerHTML = path;
}

// ── STATE ────────────────────────────────────────────────────────────────────
let gameMode = "color", score = 0, qNum = 0, correctCount = 0;
let totalQ = 10, answered = false;
let best = parseInt(localStorage.getItem("colorShapeBest")||"0");
let audioCtx = null;
document.getElementById("best").textContent = best;

function beep(f, d=0.15, t="sine") {
  try {
    if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    o.type=t;o.frequency.value=f;
    g.gain.setValueAtTime(0.2,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);
    o.start();o.stop(audioCtx.currentTime+d);
  } catch(e){}
}
const playOk   = () => [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,"triangle"),i*60));
const playFail = () => { beep(200,"sawtooth",0.3); };

function setMode(m) {
  gameMode = m;
  ["color","shape","mix"].forEach(x => {
    const tab = document.getElementById("tab-"+x);
    tab.classList.toggle("active", x===m);
    if (x===m) {
      tab.style.background = m==="color"
        ? "linear-gradient(135deg,#FF6B6B,#FF9F43)"
        : m==="shape" ? "linear-gradient(135deg,#4ECDC4,#45B7D1)"
        : "linear-gradient(135deg,#A29BFE,#FD79A8)";
    } else {
      tab.style.background = "";
      tab.style.color = "";
    }
  });
  const labels = {color: t('color'), shape: t('shape'), mix: t('mix')};
  document.getElementById("mode-label").textContent = labels[m];
}

function shuffle(a) { return [...a].sort(()=>Math.random()-0.5); }

function getPool() {
  if (gameMode==="color") return COLORS_DATA.map(c=>({...c, kind:"color"}));
  if (gameMode==="shape") {
    const color = COLORS_DATA[Math.floor(Math.random()*COLORS_DATA.length)];
    return SHAPES_DATA.map(s=>({...s, kind:"shape", color}));
  }
  // mix
  const pool = [];
  COLORS_DATA.slice(0,4).forEach(c => pool.push({...c, kind:"color"}));
  const col = COLORS_DATA[Math.floor(Math.random()*COLORS_DATA.length)];
  SHAPES_DATA.slice(0,4).forEach(s => pool.push({...s, kind:"shape", color:col}));
  return pool;
}

let currentItem = null, choiceItems = [];
function nextQ() {
  if (qNum >= totalQ) { endGame(); return; }
  answered = false;
  document.getElementById("prog-inner").style.width = (qNum/totalQ*100) + "%";

  const pool = shuffle(getPool());
  currentItem = pool[0];
  const wrong = pool.slice(1,4);
  choiceItems = shuffle([currentItem, ...wrong]);

  const emojiEl = document.getElementById("q-target");
  const svgEl   = document.getElementById("q-target-shape");
  const nameEl  = document.getElementById("q-name");
  const hintEl  = document.getElementById("q-hint");
  const cardEl  = document.getElementById("q-card");

  if (currentItem.kind === "color") {
    emojiEl.style.display = "block";
    svgEl.style.display   = "none";
    emojiEl.textContent   = currentItem.emoji;
    nameEl.textContent    = currentItem.name.toUpperCase() + t('colorSuffix');
    nameEl.style.color    = currentItem.hex;
    hintEl.textContent    = t('colorHint');
    cardEl.style.background = currentItem.light;
  } else {
    emojiEl.style.display = "none";
    svgEl.style.display   = "block";
    drawShape(svgEl, currentItem.type, currentItem.color.hex, 72);
    svgEl.setAttribute("width","72"); svgEl.setAttribute("height","72");
    nameEl.textContent  = currentItem.name.toUpperCase();
    nameEl.style.color  = currentItem.color.hex;
    hintEl.textContent  = t('shapeHint');
    cardEl.style.background = currentItem.color.light;
  }
  document.getElementById("q-instruction").textContent = `${qNum+1} / ${totalQ} — ` + t('find');

  // Build choices
  const grid = document.getElementById("choices-grid");
  grid.innerHTML = "";
  const choiceColors = ["#FF6B6B","#4ECDC4","#FECA57","#A29BFE"];
  choiceItems.forEach((item, i) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    if (item.kind === "color") {
      btn.innerHTML = `
        <div style="width:54px;height:54px;border-radius:50%;background:${item.hex};
                    box-shadow:0 3px 10px ${item.hex}66"></div>
        <span class="choice-label">${item.name}</span>`;
    } else {
      const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
      svg.setAttribute("width","54"); svg.setAttribute("height","54");
      svg.setAttribute("viewBox","0 0 56 56");
      drawShape(svg, item.type, item.color ? item.color.hex : choiceColors[i]);
      btn.appendChild(svg);
      const lbl = document.createElement("span");
      lbl.className = "choice-label";
      lbl.textContent = item.name;
      btn.appendChild(lbl);
    }
    btn.onclick = () => checkChoice(item, btn);
    grid.appendChild(btn);
  });
}

function checkChoice(item, btn) {
  if (answered) return;
  answered = true;
  const isOk = item.name === currentItem.name;
  if (isOk) {
    btn.classList.add("correct");
    score += 10; correctCount++;
    document.getElementById("score").textContent = score;
    playOk();
    confetti();
  } else {
    btn.classList.add("wrong");
    document.querySelectorAll(".choice").forEach((b,i) => {
      if (choiceItems[i].name === currentItem.name) b.classList.add("correct");
    });
    playFail();
  }
  qNum++;
  setTimeout(nextQ, 900);
}

function confetti() {
  const emojis = ["🌟","⭐","✨","🎉","🌈","💫"];
  for (let i=0;i<8;i++) {
    setTimeout(() => {
      const el = document.createElement("div");
      el.className = "confetti";
      el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      el.style.left = (10 + Math.random()*80)+"vw";
      el.style.top  = "-30px";
      el.style.setProperty("--tx", (Math.random()*60-30)+"px");
      document.body.appendChild(el);
      setTimeout(()=>el.remove(), 1200);
    }, i*80);
  }
}

function startGame() {
  score=0; qNum=0; correctCount=0;
  document.getElementById("score").textContent="0";
  document.getElementById("prog-inner").style.width="0%";
  document.getElementById("start-screen").classList.add("hidden");
  document.getElementById("result-screen").classList.add("hidden");
  nextQ();
}

function endGame() {
  GameAPI.reportScore(GAME_ID, score);
  if (GameAPI.saveBestScore(GAME_ID, score)) {
    best = score;
    document.getElementById("best").textContent = best;
  }

  const pct = correctCount/totalQ;
  document.getElementById("r-emoji").textContent = pct>=0.9?"🏆":pct>=0.7?"🎉":"⭐";
  document.getElementById("r-title").textContent = pct>=0.9 ? t('smart') : (pct>=0.7 ? t('great') : t('good'));
  document.getElementById("r-score").textContent   = score;
  document.getElementById("r-correct").textContent = `${correctCount}/${totalQ}`;
  document.getElementById("r-msg").textContent = pct>=0.9
    ? t('msgSmart')
    : pct>=0.7 ? t('msgGreat')
    : t('msgGood');
  if (pct>=0.8) confetti();

  GameAPI.endGame();
  document.getElementById("result-screen").classList.remove("hidden");
}
function goHome() {
  document.getElementById("result-screen").classList.add("hidden");
  document.getElementById("start-screen").classList.remove("hidden");
}

setMode("color");
window.addEventListener('load', () => window.AdMobMgr?.init('colors-shapes'));
</script>
</body>
</html>
