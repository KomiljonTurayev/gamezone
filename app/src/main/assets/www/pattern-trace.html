<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pattern Trace Master 🧩</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; touch-action:manipulation; }
body {
  min-height: 100vh;
  background: #1e1b4b;
  font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
  overflow: hidden;
  color: white;
  display: flex; flex-direction: column;
}
#header { padding: 15px; display: flex; justify-content: space-between; background: rgba(0,0,0,0.3); }
.stat { text-align: center; }
.stat-val { font-size: 24px; font-weight: 900; color: #a78bfa; }
.stat-lbl { font-size: 10px; opacity: 0.6; }

#arena {
  flex: 1;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}

#grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 15px; width: 100%; max-width: 320px; aspect-ratio: 1/1;
}

.pad {
  border-radius: 20px; cursor: pointer; transition: all 0.2s;
  opacity: 0.4; border: 4px solid rgba(255,255,255,0.1);
}
.pad.active { opacity: 1; transform: scale(0.95); box-shadow: 0 0 30px currentColor; border-color: white; }

#p0 { background-color: #ef4444; color: #ef4444; }
#p1 { background-color: #3b82f6; color: #3b82f6; }
#p2 { background-color: #10b981; color: #10b981; }
#p3 { background-color: #fbbf24; color: #fbbf24; }

#screen-start, #screen-over {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(15, 23, 42, 0.98);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 30px; text-align: center;
}
.hidden { display: none !important; }
.btn {
  background: #a78bfa; color: #1e1b4b; border: none; padding: 15px 45px;
  border-radius: 50px; font-size: 18px; font-weight: 900; cursor: pointer;
  margin-top: 25px;
}
#hint-text { margin-bottom: 20px; font-size: 18px; font-weight: bold; color: #c4b5fd; }
</style>
<script src="admob.js"></script>
</head>
<body>
<div id="app">
  <div id="header">
    <div class="stat"><span class="stat-lbl" id="lbl-best">BEST</span><br><span class="stat-val" id="best">0</span></div>
    <div class="stat"><span class="stat-lbl" id="lbl-score">SCORE</span><br><span class="stat-val" id="score">0</span></div>
    <div class="stat"><span class="stat-lbl" id="lbl-level">LEVEL</span><br><span class="stat-val" id="level">1</span></div>
  </div>
  <div id="arena">
    <div>
      <div id="hint-text">Tayyorlaning...</div>
      <div id="grid">
        <div class="pad" id="p0" onclick="playerTap(0)"></div>
        <div class="pad" id="p1" onclick="playerTap(1)"></div>
        <div class="pad" id="p2" onclick="playerTap(2)"></div>
        <div class="pad" id="p3" onclick="playerTap(3)"></div>
      </div>
    </div>
  </div>
</div>

<div id="screen-start">
  <div style="font-size: 80px">🧩</div>
  <h1 id="start-title">Pattern Trace</h1>
  <p id="start-desc">Ketma-ketlikni eslab qoling va takrorlang!</p>
  <button class="btn" onclick="startGame()" id="btn-start">START</button>
</div>

<div id="screen-over" class="hidden">
  <h1 id="over-title">O'yin Tugadi</h1>
  <div style="font-size: 60px; margin: 20px 0; color: #a78bfa" id="final-score">0</div>
  <button class="btn" onclick="startGame()" id="btn-again">TRY AGAIN</button>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const LANG = (params.get('lang') || 'uz').toLowerCase();
const I18N = {
  uz: { best:"REKORD", score:"BALL", level:"DARAJA", start:"Pattern Trace", desc:"Ketma-ketlikni eslab qoling va qaytaring!", btnStart:"BOSHLASH", btnAgain:"QAYTA O'YNASH", over:"O'yin Tugadi", watch:"Kuzating...", yourTurn:"Sizning navbatingiz!" },
  ru: { best:"РЕКОРД", score:"СЧЕТ", level:"УРОВЕНЬ", start:"Паттерн", desc:"Запомни последовательность и повтори ее!", btnStart:"СТАРТ", btnAgain:"ЗАНОВО", over:"Игра Окончена", watch:"Смотри...", yourTurn:"Твой черед!" },
  en: { best:"BEST", score:"SCORE", level:"LEVEL", start:"Pattern Trace", desc:"Remember the sequence and repeat it!", btnStart:"START", btnAgain:"PLAY AGAIN", over:"Game Over", watch:"Watch...", yourTurn:"Your turn!" }
};
const t = I18N[LANG] || I18N.en;

document.getElementById('lbl-best').textContent = t.best;
document.getElementById('lbl-score').textContent = t.score;
document.getElementById('lbl-level').textContent = t.level;
document.getElementById('start-title').textContent = t.start;
document.getElementById('start-desc').textContent = t.desc;
document.getElementById('btn-start').textContent = t.btnStart;
document.getElementById('btn-again').textContent = t.btnAgain;
document.getElementById('over-title').textContent = t.over;

let sequence = [], playerSeq = [], gameActive = false, score = 0;
let best = parseInt(localStorage.getItem('gz-best-pattern-trace') || '0');
document.getElementById('best').textContent = best;

function startGame() {
  sequence = []; score = 0; gameActive = true;
  document.getElementById('score').textContent = "0";
  document.getElementById('screen-start').classList.add('hidden');
  document.getElementById('screen-over').classList.add('hidden');
  nextLevel();
}

function nextLevel() {
  playerSeq = [];
  sequence.push(Math.floor(Math.random() * 4));
  document.getElementById('level').textContent = sequence.length;
  playSequence();
}

async function playSequence() {
  gameActive = false;
  document.getElementById('hint-text').textContent = t.watch;
  for (let i = 0; i < sequence.length; i++) {
    await wait(300);
    flashPad(sequence[i]);
    await wait(500);
  }
  document.getElementById('hint-text').textContent = t.yourTurn;
  gameActive = true;
}

function flashPad(id) {
  const el = document.getElementById('p' + id);
  el.classList.add('active');
  setTimeout(() => el.classList.remove('active'), 300);
}

function playerTap(id) {
  if (!gameActive) return;
  flashPad(id);
  playerSeq.push(id);

  const step = playerSeq.length - 1;
  if (playerSeq[step] !== sequence[step]) {
    endGame();
    return;
  }

  if (playerSeq.length === sequence.length) {
    score += 10 * sequence.length;
    document.getElementById('score').textContent = score;
    setTimeout(nextLevel, 1000);
  }
}

function endGame() {
  gameActive = false;
  document.getElementById('final-score').textContent = score;
  document.getElementById('screen-over').classList.remove('hidden');
  if (score > best) {
    best = score;
    localStorage.setItem('gz-best-pattern-trace', best);
    document.getElementById('best').textContent = best;
  }
  window.parent.postMessage({ type: "game:score", id: "pattern-trace", score: score }, "*");
  window.parent.__gameEnd?.();
}

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }
</script>
</body>
</html>
