<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Math Quest Academy 🔢</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; touch-action:manipulation; }

:root {
  --neon: #4ECDC4; --neon2: #f093fb; --neon3: #4481eb;
  --bg: #050510; --card: rgba(255,255,255,0.05);
}

body {
  min-height:100vh; background: var(--bg);
  font-family: 'Segoe UI', Roboto, sans-serif; overflow: hidden; color: white;
}

#app { display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding-bottom: 70px; position: relative; z-index: 5; }

#topbar { width: 100%; max-width: 480px; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
.pill { background: var(--card); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 10px 20px; text-align: center; }
.pill-label { font-size: 9px; opacity: 0.5; letter-spacing: 1px; text-transform: uppercase; }
.pill-val { font-size: 22px; font-weight: 900; color: var(--neon); }

#timer-wrap { width: 90%; height: 6px; background: rgba(255,255,255,0.05); border-radius: 10px; margin: 10px auto; overflow: hidden; }
#timer-bar { height: 100%; width: 100%; background: var(--neon); transition: width 0.1s linear; }

#q-card { background: var(--card); border: 1px solid rgba(255,255,255,0.1); border-radius: 30px; padding: 30px; margin: 10px 20px; text-align: center; width: calc(100% - 40px); max-width: 440px; }
#q-emojis { font-size: 40px; min-height: 60px; display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; }
#q-text { font-size: 28px; font-weight: 900; margin-top: 15px; }

#answers { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 440px; padding: 20px; }
.ans-btn { background: var(--card); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 25px 10px; font-size: 36px; font-weight: 900; color: white; cursor: pointer; transition: all 0.1s; }
.ans-btn:active { transform: scale(0.95); background: rgba(255,255,255,0.1); }
.ans-btn.correct { background: #10B981 !important; border-color: #10B981; }
.ans-btn.wrong { background: #EF4444 !important; border-color: #EF4444; }

.screen { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg); padding: 30px; }
.hidden { display: none !important; }
.btn-main { background: linear-gradient(135deg, var(--neon), #45B7D1); border: none; border-radius: 50px; padding: 18px 50px; color: white; font-size: 18px; font-weight: 900; cursor: pointer; box-shadow: 0 10px 25px rgba(78,205,196,0.3); }

.mode-btn { width: 100%; max-width: 320px; background: var(--card); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 20px; margin-bottom: 12px; display: flex; align-items: center; gap: 20px; cursor: pointer; color: white; text-align: left; }
.mode-btn:active { transform: scale(0.97); }
.mode-btn b { font-size: 30px; }
.mode-btn div span { display: block; font-size: 16px; font-weight: 900; }
.mode-btn div small { font-size: 12px; opacity: 0.6; }
</style>
<script src="game-api.js"></script>
</head>
<body>

<div id="app">
  <div id="topbar">
    <div class="pill"><div class="pill-label" id="l-score">SCORE</div><div class="pill-val" id="v-score">0</div></div>
    <div class="pill"><div class="pill-label" id="l-streak">STREAK</div><div class="pill-val" id="v-streak">0</div></div>
  </div>
  <div id="timer-wrap"><div id="timer-bar"></div></div>
  <div id="q-card">
    <div id="q-emojis">🍎🍎🍎</div>
    <div id="q-text">3</div>
  </div>
  <div id="answers"></div>
</div>

<div class="screen" id="s-start">
  <div style="font-size: 80px; margin-bottom: 20px;">🔢</div>
  <h1 id="t-start" style="font-size: 32px; margin-bottom: 10px;">Math Quest</h1>
  <p id="d-start" style="opacity: 0.7; margin-bottom: 30px; text-align: center;">Matematikani o'yin bilan o'rganing!</p>
  <div id="modes" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
    <button class="mode-btn" onclick="start('count')"><b>1️⃣</b><div><span id="m-count">COUNT</span><small id="d-count">1-10 gacha</small></div></button>
    <button class="mode-btn" onclick="start('add')"><b>➕</b><div><span id="m-add">ADDITION</span><small id="d-add">Qo'shish</small></div></button>
    <button class="mode-btn" onclick="start('sub')"><b>➖</b><div><span id="m-sub">SUBTRACTION</span><small id="d-sub">Ayirish</small></div></button>
  </div>
</div>

<div class="screen hidden" id="s-over">
  <div style="font-size: 80px" id="r-emoji">🎉</div>
  <h1 id="r-title" style="font-size: 32px; margin: 10px 0;">Great!</h1>
  <div style="font-size: 56px; font-weight: 900; color: var(--neon); margin-bottom: 30px;" id="v-final">0</div>
  <button class="btn-main" onclick="start(gameMode)" id="b-again">QAYTA</button>
</div>

<script>
const GAME_ID = 'math-kids';
const I18N = {
  uz: { score:"BALL", streak:"SERIYA", start:"Boshlash", count:"SANASH", add:"QO'SHISH", sub:"AYIRISH", dCount:"Nechta element?", dAdd:"Sonlarni qo'shing", dSub:"Sonlarni ayiring", over:"O'yin Tugadi", again:"QAYTA O'YNASH", good:"Yaxshi!", great:"Ajoyib!", smart:"Aqlli bola!", howMany: "Nechta? 🤔" },
  ru: { score:"БАЛЛЫ", streak:"СЕРИЯ", start:"Начать", count:"СЧЕТ", add:"СЛОЖЕНИЕ", sub:"ВЫЧИТАНИЕ", dCount:"Сколько предметов?", dAdd:"Сложи числа", dSub:"Вычти числа", over:"Игра Окончена", again:"ЗАНОВО", good:"Хорошо!", great:"Отлично!", smart:"Умница!", howMany: "Сколько? 🤔" },
  en: { score:"SCORE", streak:"STREAK", start:"Start", count:"COUNT", add:"ADDITION", sub:"SUBTRACTION", dCount:"How many items?", dAdd:"Add numbers", dSub:"Subtract numbers", over:"Game Over", again:"PLAY AGAIN", good:"Good!", great:"Great!", smart:"Smart kid!", howMany: "How many? 🤔" }
};
const t = GameAPI.t.bind(GameAPI, I18N);

function setupUI() {
  document.getElementById('l-score').textContent = t('score');
  document.getElementById('l-streak').textContent = t('streak');
  document.getElementById('t-start').textContent = t('start');
  document.getElementById('m-count').textContent = t('count');
  document.getElementById('d-count').textContent = t('dCount');
  document.getElementById('m-add').textContent = t('add');
  document.getElementById('d-add').textContent = t('dAdd');
  document.getElementById('m-sub').textContent = t('sub');
  document.getElementById('d-sub').textContent = t('dSub');
  document.getElementById('b-again').textContent = t('again');
}

let gameMode = 'count', score = 0, streak = 0, qNum = 0, active = false;
let currentQ = null, timerInterval = null;

function genQ() {
  const emojis = ["🍎","🍊","🍋","🍇","🍓","⭐","🎈","🎮","💎","🐱"];
  const emo = emojis[Math.floor(Math.random()*emojis.length)];
  if (gameMode === 'count') {
    const val = Math.floor(Math.random()*10)+1;
    return { display: Array(val).fill(emo).join(''), text: t('howMany'), correct: val };
  } else if (gameMode === 'add') {
    const a = Math.floor(Math.random()*9)+1, b = Math.floor(Math.random()*(10-a))+1;
    return { display: `${a} + ${b}`, text: `${a} + ${b} = ?`, correct: a+b };
  } else {
    const a = Math.floor(Math.random()*9)+2, b = Math.floor(Math.random()*(a-1))+1;
    return { display: `${a} - ${b}`, text: `${a} - ${b} = ?`, correct: a-b };
  }
}

function next() {
  if (!active) return;
  if (qNum >= 10) return end();
  currentQ = genQ();
  document.getElementById('q-emojis').textContent = currentQ.display;
  document.getElementById('q-text').textContent = currentQ.text;

  const ans = document.getElementById('answers');
  ans.innerHTML = "";
  const opts = new Set([currentQ.correct]);
  while(opts.size < 4) {
    const fake = currentQ.correct + (Math.floor(Math.random()*10)-5);
    if (fake >= 0) opts.add(fake);
  }
  [...opts].sort(()=>Math.random()-0.5).forEach(v => {
    const b = document.createElement('button');
    b.className = 'ans-btn';
    b.textContent = v;
    b.onclick = () => check(v, b);
    ans.appendChild(b);
  });

  let time = 10 * GameAPI.profile.timer;
  const total = time;
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    time -= 0.1;
    document.getElementById('timer-bar').style.width = (time/total*100) + '%';
    if(time <= 0) {
      clearInterval(timerInterval);
      streak = 0;
      document.getElementById('v-streak').textContent = 0;
      qNum++;
      next();
    }
  }, 100);
}

function check(v, b) {
  if (!active) return;
  clearInterval(timerInterval);
  if (v === currentQ.correct) {
    b.classList.add('correct'); score += 10 + streak*2; streak++;
    GameAPI.vibrate(20);
  } else {
    b.classList.add('wrong'); streak = 0;
    GameAPI.vibrate(100);
  }
  document.getElementById('v-score').textContent = score;
  document.getElementById('v-streak').textContent = streak;
  qNum++;
  setTimeout(next, 600);
}

function start(m) {
  gameMode = m; score = 0; streak = 0; qNum = 0; active = true;
  document.getElementById('s-start').classList.add('hidden');
  document.getElementById('s-over').classList.add('hidden');
  document.getElementById('v-score').textContent = '0';
  document.getElementById('v-streak').textContent = '0';
  next();
}

function end() {
  active = false; clearInterval(timerInterval);
  document.getElementById('v-final').textContent = score;
  document.getElementById('r-title').textContent = t('over');

  let emoji = '😊', title = t('good');
  if (score >= 150) { emoji = '🏆'; title = t('smart'); }
  else if (score >= 100) { emoji = '🔥'; title = t('great'); }

  document.getElementById('r-emoji').textContent = emoji;
  document.getElementById('r-title').textContent = title;

  document.getElementById('s-over').classList.remove('hidden');
  GameAPI.saveBestScore(GAME_ID, score);
  GameAPI.reportScore(GAME_ID, score);
  GameAPI.endGame();
}

window.addEventListener('gameDispose', () => {
  active = false;
  clearInterval(timerInterval);
});

setupUI();
</script>
</body>
</html>
