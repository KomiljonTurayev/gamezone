<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tower Stack Master 🗼</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; touch-action:manipulation; }
body { margin: 0; overflow: hidden; background: #001828; font-family: sans-serif; color: white; }
#game { width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
.block { position: absolute; height: 45px; background: #6366F1; border: 2px solid rgba(255,255,255,0.2); box-sizing: border-box; border-radius: 4px; }
#hud { position: fixed; top: 0; left: 0; right: 0; padding: 15px; display: flex; justify-content: space-between; background: rgba(0,0,0,0.3); z-index: 10; }
.stat { text-align: center; }
.stat-val { font-size: 24px; font-weight: 900; color: #06b6d4; }
.stat-lbl { font-size: 10px; opacity: 0.6; }

#screen-start, #screen-over {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(0, 24, 40, 0.95);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 30px; text-align: center;
}
.hidden { display: none !important; }
.btn {
  background: #06b6d4; color: #001828; border: none; padding: 18px 50px;
  border-radius: 50px; font-size: 18px; font-weight: 900; cursor: pointer;
  margin-top: 25px; box-shadow: 0 5px 15px rgba(6, 182, 212, 0.4);
}
</style>
<script src="admob.js"></script>
</head>
<body>

<div id="hud">
  <div class="stat"><span class="stat-lbl" id="lbl-best">BEST</span><br><span class="stat-val" id="best">0</span></div>
  <div class="stat"><span class="stat-lbl" id="lbl-score">SCORE</span><br><span class="stat-val" id="score">0</span></div>
</div>

<div id="game"></div>

<div id="screen-start">
  <div style="font-size: 80px">🗼</div>
  <h1 id="start-title">Tower Stack</h1>
  <p id="start-desc">Bloklarni bir-birining ustiga aniq qo'ying!</p>
  <button class="btn" onclick="startGame()" id="btn-start">START</button>
</div>

<div id="screen-over" class="hidden">
  <h1 id="over-title">GAME OVER</h1>
  <div style="font-size: 60px; margin: 20px 0; color: #06b6d4" id="final-score">0</div>
  <button class="btn" onclick="startGame()" id="btn-again">TRY AGAIN</button>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const LANG = (params.get('lang') || 'uz').toLowerCase();
const I18N = {
  uz: { best:"REKORD", score:"BALL", start:"Tower Stack", desc:"Bloklarni bir-birining ustiga qo'yib minora quring!", btnStart:"BOSHLASH", btnAgain:"QAYTA O'YNASH", over:"O'yin Tugadi" },
  ru: { best:"РЕКОРД", score:"СЧЕТ", start:"Башня", desc:"Ставь блоки друг на друга и строй башню!", btnStart:"СТАРТ", btnAgain:"ЗАНОВО", over:"Игра Окончена" },
  en: { best:"BEST", score:"SCORE", start:"Tower Stack", desc:"Stack the blocks on top of each other!", btnStart:"START", btnAgain:"PLAY AGAIN", over:"Game Over" }
};
const t = I18N[LANG] || I18N.en;

document.getElementById('lbl-best').textContent = t.best;
document.getElementById('lbl-score').textContent = t.score;
document.getElementById('start-title').textContent = t.start;
document.getElementById('start-desc').textContent = t.desc;
document.getElementById('btn-start').textContent = t.btnStart;
document.getElementById('btn-again').textContent = t.btnAgain;
document.getElementById('over-title').textContent = t.over;

const game = document.getElementById('game');
let score = 0, width = 180, currentBlock, direction = 1, speed = 2.5, blocks = [], gameOver = true, offset = 0;
let best = parseInt(localStorage.getItem('gz-best-stack-tower') || '0');
document.getElementById('best').textContent = best;

function startGame() {
  score = 0; width = 180; speed = 2.5; offset = 0; blocks = []; gameOver = false;
  game.innerHTML = '';
  game.style.transform = 'translateY(0)';
  document.getElementById('score').textContent = "0";
  document.getElementById('screen-start').classList.add('hidden');
  document.getElementById('screen-over').classList.add('hidden');
  createBlock();
  requestAnimationFrame(step);
}

function createBlock() {
  const b = document.createElement('div');
  b.className = 'block';
  b.style.width = width + 'px';
  b.style.bottom = (blocks.length * 45) + 'px';
  b.style.left = '0px';
  const hue = (blocks.length * 20) % 360;
  b.style.backgroundColor = `hsl(${hue}, 70%, 55%)`;
  game.appendChild(b);
  currentBlock = { el: b, x: 0, w: width };
  if (blocks.length > 5) {
    offset -= 45;
    game.style.transform = `translateY(${offset}px)`;
  }
}

function step() {
  if (gameOver) return;
  currentBlock.x += direction * speed;
  if (currentBlock.x + currentBlock.w > window.innerWidth || currentBlock.x < 0) direction *= -1;
  currentBlock.el.style.left = currentBlock.x + 'px';
  requestAnimationFrame(step);
}

function place() {
  if (gameOver) return;
  if (blocks.length > 0) {
    const prev = blocks[blocks.length - 1];
    const diff = currentBlock.x - prev.x;
    if (Math.abs(diff) >= currentBlock.w) { endGame(); return; }
    if (diff > 0) currentBlock.w -= diff;
    else { currentBlock.w += diff; currentBlock.x = prev.x; }
    width = currentBlock.w;
    currentBlock.el.style.width = width + 'px';
    currentBlock.el.style.left = currentBlock.x + 'px';
  }
  blocks.push({ x: currentBlock.x, w: currentBlock.w });
  score++;
  document.getElementById('score').textContent = score;
  speed += 0.15;
  createBlock();
}

function endGame() {
  gameOver = true;
  document.getElementById('final-score').textContent = score;
  document.getElementById('screen-over').classList.remove('hidden');
  if (score > best) {
    best = score;
    localStorage.setItem('gz-best-stack-tower', best);
    document.getElementById('best').textContent = best;
  }
  window.parent.postMessage({ type: "game:score", id: "stack-tower", score: score }, "*");
  window.parent.__gameEnd?.();
}

window.addEventListener('touchstart', (e) => { e.preventDefault(); place(); });
window.addEventListener('mousedown', place);
</script>
</body>
</html>
