<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#080818">
<title>GameZone UZ</title>
<style>
:root {
  --cols:2;--gap:12px;--pad:14px;--hh:62px;--bh:60px;
  --fs:13px;--fh:24px;--r:22px;
  --bg:#0A0A1F;--surf:rgba(255,255,255,0.05);--brd:rgba(255,255,255,0.1);
  --txt:#F8FAFC;--txt2:#94A3B8;
  --a1:#6366F1;--a2:#A855F7;
  --ad-h:0px;
  --app-vh:1vh;--app-height:100vh;
}
@media(min-width:480px){:root{--cols:3;--fh:28px}}
@media(min-width:768px){:root{--cols:3;--gap:16px;--pad:22px;--hh:76px;--bh:90px;--fs:15px;--fh:34px;--r:28px}}
@media(min-width:1024px){:root{--cols:4;--fh:38px}}
@media(min-width:1280px){:root{--cols:5}}

*{margin:0;padding:0;box-sizing:border-box;touch-action:manipulation}
body{
  background:var(--bg);
  height:var(--app-height);
  font-family:'Trebuchet MS',sans-serif;
  color:var(--txt);
  overflow:hidden;
  display: flex;
  flex-direction: column;
}

/* SAFE AREA BACKGROUNDS */
#safe-top { height: env(safe-area-inset-top, 0px); background: #0A0A1F; flex-shrink: 0; }
#safe-bottom { height: env(safe-area-inset-bottom, 0px); background: #0A0A1F; flex-shrink: 0; }

/* AMBIENT */
#amb{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(110px);opacity:.2;animation:drift ease-in-out infinite}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-35px)}}

/* HEADER */
#hdr{
  height:var(--hh);
  background:rgba(10,10,31,0.85); backdrop-filter:blur(20px);
  border-bottom:1px solid var(--brd);
  display:flex; align-items:center; padding:0 var(--pad); gap:10px;
  position:relative; z-index:10; flex-shrink: 0;
}
#logo{display:flex;align-items:center;gap:10px}
#logo-ic{width:42px;height:42px;background:linear-gradient(135deg,var(--a1),var(--a2));border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 6px 20px rgba(99,102,241,.3);flex-shrink:0;}
#logo-nm{font-size:15px;font-weight:900;color:var(--txt)}
#hdr-sp{flex:1}
#pts{background:rgba(255,255,255,0.08); border:1px solid var(--brd); border-radius:12px; padding:6px 12px; display:flex; align-items:center; gap:5px;}

/* CONTENT WRAPPER */
#main-wrap {
  flex: 1;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

#main {
  flex: 1;
  overflow-y: auto;
  padding: var(--pad);
  scrollbar-width: none;
  position: relative;
  z-index: 1;
}
#main::-webkit-scrollbar { display: none; }

/* GRID */
#grid {
  display: grid;
  grid-template-columns: repeat(var(--cols), 1fr);
  gap: var(--gap);
  padding-bottom: 20px;
}

/* GAME CARD */
.gc {
  background: var(--surf); border: 1px solid var(--brd); border-radius: var(--r);
  overflow: hidden; cursor: pointer; transition: transform 0.1s;
  aspect-ratio: 3/4; display: flex; flex-direction: column;
}
.gc:active { transform: scale(0.96); }
.gc-art { flex: 1; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.02); position: relative; }
.gc-em { font-size: clamp(34px, 7vw, 60px); filter: drop-shadow(0 3px 10px rgba(0,0,0,0.3)); }
.gc-info { padding: 12px; background: rgba(255,255,255,0.03); border-top: 1px solid var(--brd); }
.gc-nm { font-size: var(--fs); font-weight: 900; color: var(--txt); margin-bottom: 4px; }
.gc-tg { font-size: 10px; padding: 2px 8px; border-radius: 10px; background: rgba(255,255,255,0.1); color: var(--txt2); }
.gc-meta { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:4px; }
.gc-ds   { font-size:10px; color:var(--txt2); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.gc-best { font-size:10px; color:#FACC15; margin-top:4px; }

.bdg { position: absolute; top: 10px; right: 10px; padding: 3px 8px; border-radius: 10px; font-size: 9px; font-weight: 900; color: white; }
.bnew { background: #10B981; }
.bhot { background: #EF4444; }

/* BOTTOM NAV (Not overlapping content because of Flex) */
#bnav {
  height: 64px;
  background: rgba(10,10,31,0.9); backdrop-filter: blur(20px);
  border-top: 1px solid var(--brd);
  display: flex; align-items: center; justify-content: space-around;
  flex-shrink: 0; position: relative; z-index: 20;
}
.ni { border: none; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--txt2); cursor: pointer; min-width: 60px; }
.ni.on { color: var(--a1); }
.ni-i { font-size: 20px; }
.ni-l { font-size: 10px; font-weight: bold; }

/* ADMOB (Absolute at bottom, pushes Nav up if present) */
#admob {
  height: var(--ad-h);
  background: #000;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; flex-shrink: 0;
  transition: height 0.3s;
}

/* MODALS */
#game-exit-modal {
  position: fixed; inset: 0; z-index: 300;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(12px);
  opacity: 0; pointer-events: none; transition: 0.3s;
}
#game-exit-modal.show { opacity: 1; pointer-events: auto; }
.exit-card {
  background: linear-gradient(135deg, #1e1b4b, #0f172a); border: 1px solid var(--brd);
  border-radius: 30px; padding: 30px; text-align: center; width: 85%; max-width: 320px;
  transform: scale(0.9); transition: 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
}
#game-exit-modal.show .exit-card { transform: scale(1); }
.exit-btn { border: none; border-radius: 16px; padding: 14px; font-size: 15px; font-weight: 900; cursor: pointer; flex: 1; }
.btn-yes { background: #EF4444; color: white; }
.btn-no { background: rgba(255,255,255,0.1); color: white; }

/* GAME OVERLAY */
#gs { position: fixed; inset: 0; z-index: 200; background: #000; display: flex; flex-direction: column; }
#gs.h { display: none; }
#gs-top { height: 50px; background: #000; display: flex; align-items: center; padding: 0 15px; border-bottom: 1px solid #333; }
#gs-back { background: #222; color: #fff; border: none; border-radius: 8px; padding: 6px 12px; font-weight: bold; cursor: pointer; min-width:42px; }
#gs-title { flex: 1; text-align: center; font-weight: bold; font-size: 14px; }
#gs-info-btn { min-width:42px; }
#gs-frame-wrap { position: relative; flex: 1; overflow: hidden; display: flex; flex-direction: column; }
#gs-frame { flex: 1; border: none; width: 100%; height: 100%; }

/* Game Loading Splash Screen Styles */
#game-loading-overlay {
  position: absolute; inset: 0; background: #080818;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 100; 
  transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  transform: scale(1);
}
/* Zoom-out effekti: Element kengayib (yaqinlashib) va shaffoflashib yo'qoladi */
#game-loading-overlay.hidden { opacity: 0; transform: scale(1.2); pointer-events: none; }
.loader-content { text-align: center; }
.game-icon-anim { font-size: 64px; margin-bottom: 20px; animation: bounce 1.8s infinite ease-in-out; }
.progress-container { width: 180px; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; margin: 20px auto; }
.progress-bar-inner { 
  height: 100%; width: 100%; 
  background: linear-gradient(90deg, #6366F1, #A855F7);
  background-size: 40px 40px;
  background-image: linear-gradient(45deg, rgba(255,255,255,.15) 25%, transparent 25%, transparent 50%, rgba(255,255,255,.15) 50%, rgba(255,255,255,.15) 75%, transparent 75%, transparent);
  animation: loading-stripes 0.8s infinite linear;
}
@keyframes bounce { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-20px) scale(1.1); } }
@keyframes loading-stripes { from { background-position: 0 0; } to { background-position: 40px 0; } }


/* LOADER */
#ld { position: fixed; inset: 0; z-index: 500; background: #0A0A1F; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
#ld.h { display: none; }

#info-modal { position:fixed;inset:0;z-index:250;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,0.7);backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:.25s; }
#info-modal.show { opacity:1;pointer-events:auto; }
.info-sheet { background:linear-gradient(135deg,#1e1b4b,#0f172a);border:1px solid rgba(255,255,255,0.1);border-radius:28px 28px 0 0;padding:28px 24px 40px;width:100%;max-width:500px; }
.info-emoji { font-size:52px;text-align:center;margin-bottom:12px; }
.info-title { font-size:18px;font-weight:900;color:white;text-align:center;margin-bottom:10px; }
.info-desc  { font-size:15px;color:rgba(255,255,255,0.75);text-align:center;line-height:1.6;margin-bottom:22px; }
.info-play  { width:100%;padding:16px;border-radius:18px;border:none;background:linear-gradient(135deg,#6366f1,#a855f7);color:white;font-size:17px;font-weight:900;cursor:pointer; }
#toast { position: fixed; top: 100px; left: 50%; transform: translateX(-50%); background: #10B981; color: #fff; padding: 10px 24px; border-radius: 30px; font-size: 14px; font-weight: bold; z-index: 600; opacity: 0; transition: 0.3s; pointer-events: none; }
#toast.s { opacity: 1; }

#lp { position: fixed; inset: 0; z-index: 400; background: #0A0A1F; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; }
#lp.h { display: none; }
</style>
</head>
<body>

<div id="safe-top"></div>

<!-- AMBIENT -->
<div id="amb">
  <div class="orb" style="width:400px;height:400px;left:-100px;top:-100px;background:#6366F1;animation-duration:10s"></div>
  <div class="orb" style="width:300px;height:300px;right:-50px;bottom:-50px;background:#A855F7;animation-duration:12s;animation-delay:-5s"></div>
</div>

<header id="hdr">
  <div id="logo">
    <div id="logo-ic">🎮</div>
    <div id="logo-nm">GameZone UZ</div>
  </div>
  <div id="hdr-sp"></div>
  <button id="fm-btn" onclick="FamilyMode.open()" style="background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:12px;color:white;font-size:13px;font-weight:bold;padding:7px 11px;cursor:pointer;margin-right:8px;">🏠</button>
  <div id="pts">⭐ <span id="pts-v">0</span></div>
</header>

<div id="main-wrap">
  <main id="main">
    <div style="display:flex; justify-content:space-between; margin-bottom:15px; align-items:center;">
      <h2 id="sec-t" style="font-size:18px; font-weight:900">O'yinlar</h2>
      <span id="sec-c" style="font-size:12px; color:var(--txt2)">0 ta</span>
    </div>

    <div id="grid"></div>
  </main>

  <nav id="bnav">
    <button class="ni on" onclick="fil('all')" id="ni-all"><span class="ni-i">🏠</span><span class="ni-l" id="nb0">Bosh</span></button>
    <button class="ni" onclick="fil('kids')" id="ni-kids"><span class="ni-i">👶</span><span class="ni-l" id="nb1">Bolalar</span></button>
    <button class="ni" onclick="fil('arcade')" id="ni-arcade"><span class="ni-i">🕹️</span><span class="ni-l" id="nb2">Arkada</span></button>
    <button class="ni" onclick="fil('relax')" id="ni-relax"><span class="ni-i">😌</span><span class="ni-l" id="nb3">Relax</span></button>
    <button class="ni" onclick="showRev()" id="ni-rev"><span class="ni-i">⚙️</span><span class="ni-l" id="nb4">Til</span></button>
  </nav>

  <div id="admob"></div>
</div>

<div id="safe-bottom"></div>

<!-- GAME VIEWER -->
<div id="gs" class="h">
  <div id="gs-top">
    <button id="gs-back" onclick="closeGame()">←</button>
    <div id="gs-title">O'yin</div>
    <button id="gs-info-btn" onclick="showInfoModal()" style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.15);border-radius:8px;color:white;font-size:13px;padding:5px 10px;cursor:pointer;">❓</button>
  </div>
  <div id="gs-frame-wrap">
    <div id="game-loading-overlay" class="hidden">
      <div class="loader-content">
        <div class="game-icon-anim">🎮</div>
        <div id="loading-text" style="font-weight: 900; letter-spacing: 1px; color: #E2E8F0;">Yuklanmoqda...</div>
        <div class="progress-container"><div class="progress-bar-inner"></div></div>
      </div>
    </div>
    <iframe id="gs-frame"></iframe>
  </div>
</div>

<!-- HOW TO PLAY MODAL -->
<div id="info-modal">
  <div class="info-sheet">
    <div class="info-emoji" id="info-emoji">🎮</div>
    <div class="info-title" id="info-title"></div>
    <div class="info-desc"  id="info-desc"></div>
    <button class="info-play" id="info-play-btn" onclick="closeInfoModal()">▶ O'ynash / Играть / Play</button>
  </div>
</div>

<!-- EXIT MODAL -->
<div id="game-exit-modal">
  <div class="exit-card">
    <div class="exit-icon">🚪</div>
    <div class="exit-msg" id="exit-modal-msg">Chiqishni xohlaysizmi?</div>
    <div style="display:flex; gap:12px;">
      <button class="exit-btn btn-no" id="exit-modal-no">Yo'q</button>
      <button class="exit-btn btn-yes" id="exit-modal-yes">Ha</button>
    </div>
  </div>
</div>

<!-- LOADER -->
<div id="ld">
  <div style="font-size:60px">🎮</div>
  <div style="font-weight:900; font-size:20px">GameZone UZ</div>
  <div id="ld-txt">Yuklanmoqda...</div>
</div>

<!-- LANG PICKER -->
<div id="lp">
  <h2 style="margin-bottom:30px; text-align:center">Tilni tanlang<br><small style="opacity:0.5; font-size:14px">Choose language</small></h2>
  <div style="display:flex; gap:15px; flex-wrap:wrap; justify-content:center">
    <button onclick="setLang('uz')" style="padding:20px; border-radius:20px; border:none; background:var(--surf); color:white; min-width:100px; cursor:pointer;">🇺🇿<br>O'zbek</button>
    <button onclick="setLang('ru')" style="padding:20px; border-radius:20px; border:none; background:var(--surf); color:white; min-width:100px; cursor:pointer;">🇷🇺<br>Русский</button>
    <button onclick="setLang('en')" style="padding:20px; border-radius:20px; border:none; background:var(--surf); color:white; min-width:100px; cursor:pointer;">🇬🇧<br>English</button>
  </div>
</div>

<div id="toast"></div>

<script src="script.js"></script>
<script src="family-mode.js"></script>
</body>
</html>
