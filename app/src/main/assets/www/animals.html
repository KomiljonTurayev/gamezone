<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Zoo Friends Safari 🐾</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
:root { --accent: #A855F7; --bg: #050510; --card: rgba(255,255,255,0.05); }
body { background: var(--bg); color: white; font-family: 'Segoe UI', Roboto, sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
#app { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 20px; }
#header { width: 100%; max-width: 480px; display: flex; justify-content: space-between; margin-bottom: 20px; }
.stat { background: var(--card); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 10px 20px; text-align: center; }
.stat-lbl { font-size: 9px; opacity: 0.5; text-transform: uppercase; letter-spacing: 1px; }
.stat-val { font-size: 22px; font-weight: 900; color: var(--accent); }

#q-card { background: var(--card); border: 1px solid rgba(255,255,255,0.1); border-radius: 30px; padding: 30px; width: 100%; max-width: 440px; text-align: center; margin-bottom: 20px; }
#animal-emoji { font-size: 100px; margin-bottom: 10px; transition: transform 0.3s; }
#animal-sound { font-size: 18px; font-weight: bold; color: var(--accent); opacity: 0.8; }

#options { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 440px; }
.opt { background: var(--card); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 20px 10px; font-size: 18px; font-weight: bold; color: white; cursor: pointer; transition: all 0.1s; }
.opt:active { transform: scale(0.95); background: rgba(255,255,255,0.1); }
.opt.correct { background: #10B981 !important; border-color: #10B981; }
.opt.wrong { background: #EF4444 !important; border-color: #EF4444; }

.screen { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; }
.hidden { display: none !important; }
.btn-main { background: linear-gradient(135deg, var(--accent), #7C3AED); border: none; border-radius: 50px; padding: 18px 50px; color: white; font-size: 18px; font-weight: 900; cursor: pointer; box-shadow: 0 10px 25px rgba(168,85,247,0.3); }

#progress { display: flex; gap: 8px; margin-top: 20px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.1); }
.dot.done-ok { background: #10B981; box-shadow: 0 0 10px #10B981; }
.dot.done-no { background: #EF4444; }
</style>
<script src="game-api.js"></script>
</head>
<body>

<div id="app">
  <div id="header">
    <div class="stat"><div class="stat-lbl" id="l-best">BEST</div><div class="stat-val" id="v-best">0</div></div>
    <div class="stat"><div class="stat-lbl" id="l-score">SCORE</div><div class="stat-val" id="v-score">0</div></div>
  </div>
  <div id="q-card">
    <div id="animal-emoji">🦁</div>
    <div id="animal-sound">Roar!</div>
  </div>
  <div id="options"></div>
  <div id="progress"></div>
</div>

<div class="screen" id="s-start">
  <div style="font-size: 80px; margin-bottom: 20px;">🐾</div>
  <h1 id="t-start" style="font-size: 32px; margin-bottom: 10px;">Zoo Safari</h1>
  <p id="d-start" style="opacity: 0.7; margin-bottom: 30px;">Hayvonlarni va ularning ovozlarini toping!</p>
  <button class="btn-main" onclick="start()">BOSHLASH</button>
</div>

<div class="screen hidden" id="s-over">
  <div style="font-size: 80px">🎉</div>
  <h1 id="r-title" style="font-size: 32px; margin: 10px 0;">Great!</h1>
  <div style="font-size: 56px; font-weight: 900; color: var(--accent); margin-bottom: 30px;" id="v-final">0</div>
  <button class="btn-main" onclick="start()">QAYTA</button>
</div>

<script>
const GAME_ID = 'animals';
const I18N = {
  uz: { best:"REKORD", score:"BALL", start:"Zoo Safari", desc:"Hayvonlarni va ularning ovozlarini toping!", over:"O'yin Tugadi", again:"QAYTA O'YNASH" },
  ru: { best:"РЕКОРД", score:"БАЛЛЫ", start:"Зоо Сафари", desc:"Угадай животных и их звуки!", over:"Игра Окончена", again:"ЗАНОВО" },
  en: { best:"BEST", score:"SCORE", start:"Zoo Safari", desc:"Identify animals and their sounds!", over:"Game Over", again:"PLAY AGAIN" }
};
const t = GameAPI.t.bind(GameAPI, I18N);

const DATA = [
  { em:"🦁", n:{uz:"Sher", ru:"Лев", en:"Lion"}, s:"Roar!" },
  { em:"🐘", n:{uz:"Fil", ru:"Слон", en:"Elephant"}, s:"Trrrr!" },
  { em:"🐶", n:{uz:"Kuchuk", ru:"Собака", en:"Dog"}, s:"Vov-vov!" },
  { em:"🐱", n:{uz:"Mushuk", ru:"Кошка", en:"Cat"}, s:"Miyov!" },
  { em:"🐮", n:{uz:"Sigir", ru:"Корова", en:"Cow"}, s:"Muuu!" },
  { em:"🐷", n:{uz:"Cho'chqa", ru:"Свинья", en:"Pig"}, s:"Oink!" },
  { em:"🐸", n:{uz:"Qurbaqa", ru:"Лягушка", en:"Frog"}, s:"Qva-qva!" },
  { em:"🐔", n:{uz:"Tovuq", ru:"Курица", en:"Chicken"}, s:"Qug-qug!" }
];

function setupUI() {
  document.getElementById('l-best').textContent = t('best');
  document.getElementById('l-score').textContent = t('score');
  document.getElementById('t-start').textContent = t('start');
  document.getElementById('d-start').textContent = t('desc');
  document.getElementById('v-best').textContent = GameAPI.getBestScore(GAME_ID);
}

let score = 0, qNum = 0, current = null, results = [];

function next() {
  if (qNum >= 8) return end();
  current = DATA[qNum];
  document.getElementById('animal-emoji').textContent = current.em;
  document.getElementById('animal-sound').textContent = current.s;

  const opts = document.getElementById('options');
  opts.innerHTML = "";
  const pool = [...DATA].sort(()=>Math.random()-0.5).slice(0, 4);
  if (!pool.find(a => a.em === current.em)) pool[0] = current;
  pool.sort(()=>Math.random()-0.5).forEach(a => {
    const name = GameAPI.localize(a.n);
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = name;
    b.onclick = () => check(a, b);
    opts.appendChild(b);
  });

  const prog = document.getElementById('progress');
  prog.innerHTML = "";
  for(let i=0; i<8; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (results[i] === true ? ' done-ok' : (results[i] === false ? ' done-no' : ''));
    prog.appendChild(d);
  }
}

function check(a, b) {
  if (a.em === current.em) {
    b.classList.add('correct'); score += 10; results.push(true);
    GameAPI.vibrate(20);
  } else {
    b.classList.add('wrong'); results.push(false);
    GameAPI.vibrate(100);
  }
  document.getElementById('v-score').textContent = score;
  qNum++;
  setTimeout(next, 600);
}

function start() {
  score = 0; qNum = 0; results = [];
  document.getElementById('s-start').classList.add('hidden');
  document.getElementById('s-over').classList.add('hidden');
  document.getElementById('v-score').textContent = '0';
  next();
}

function end() {
  document.getElementById('v-final').textContent = score;
  document.getElementById('r-title').textContent = t('over');
  document.getElementById('s-over').classList.remove('hidden');
  GameAPI.saveBestScore(GAME_ID, score);
  GameAPI.reportScore(GAME_ID, score);
  GameAPI.endGame();
}

setupUI();
</script>
</body>
</html>
