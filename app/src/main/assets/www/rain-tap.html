<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rain Tap</title>
    <style>
        body { margin: 0; overflow: hidden; background: #001428; font-family: sans-serif; display: flex; align-items: center; justify-content: center; touch-action: none; }
        canvas { position: absolute; top: 0; left: 0; }
        #ui { z-index: 10; color: rgba(255,255,255,0.4); text-align: center; pointer-events: none; }
        .drop { position: absolute; background: rgba(255,255,255,0.2); width: 1px; height: 10px; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui"></div>
    <canvas id="canvas"></canvas>
    <script src="game-api.js"></script>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let ripples = [];
        let drops = [];
        let active = true;
        let tapCount = 0;

        const I18N = {
            uz: { hint: "Tinchlanish uchun ekranga bosing 🌧️" },
            ru: { hint: "Нажимай на экран, чтобы расслабиться 🌧️" },
            en: { hint: "Tap the screen to relax 🌧️" }
        };
        const t = GameAPI.t.bind(GameAPI, I18N);
        document.getElementById('ui').textContent = t('hint');

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            drops = [];
            for(let i=0; i<80; i++) {
                drops.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    l: Math.random() * 15 + 5,
                    s: Math.random() * 10 + 10
                });
            }
        }

        window.addEventListener('resize', init);

        function addRipple(x, y) {
            ripples.push({ x, y, r: 0, a: 1 });
            tapCount++;
            GameAPI.vibrate(10);
        }

        function draw() {
            if (!active) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw rain drops
            ctx.strokeStyle = 'rgba(255,255,255,0.15)';
            ctx.lineWidth = 1;
            drops.forEach(d => {
                ctx.beginPath();
                ctx.moveTo(d.x, d.y);
                ctx.lineTo(d.x, d.y + d.l);
                ctx.stroke();
                d.y += d.s * GameAPI.profile.speed;
                if (d.y > canvas.height) {
                    d.y = -d.l;
                    d.x = Math.random() * canvas.width;
                }
            });

            // Draw ripples
            ctx.lineWidth = 2;
            for (let i = ripples.length - 1; i >= 0; i--) {
                const r = ripples[i];
                ctx.beginPath();
                ctx.strokeStyle = `rgba(255,255,255,${r.a})`;
                ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
                ctx.stroke();

                r.r += 2 * GameAPI.profile.speed;
                r.a -= 0.02;
                if (r.a <= 0) ripples.splice(i, 1);
            }

            requestAnimationFrame(draw);
        }

        window.addEventListener('touchstart', e => {
            e.preventDefault();
            addRipple(e.touches[0].clientX, e.touches[0].clientY);
        });
        window.addEventListener('mousedown', e => { addRipple(e.clientX, e.clientY); });

        window.addEventListener('gameDispose', () => {
            active = false;
            GameAPI.reportScore('rain-tap', tapCount);
            GameAPI.saveBestScore('rain-tap', tapCount);
            GameAPI.endGame();
        });

        init();
        draw();
    </script>
</body>
</html>
