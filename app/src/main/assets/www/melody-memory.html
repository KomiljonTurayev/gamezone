<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Melody Memory Master 🎵</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; touch-action:manipulation; }
body {
  min-height: 100vh;
  background: #2e1065;
  font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
  overflow: hidden;
  color: white;
  display: flex; flex-direction: column;
}
#header { padding: 15px; display: flex; justify-content: space-between; background: rgba(0,0,0,0.3); }
.stat { text-align: center; }
.stat-val { font-size: 24px; font-weight: 900; color: #c084fc; }
.stat-lbl { font-size: 10px; opacity: 0.6; }

#arena {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 20px;
}

#piano {
  display: flex; gap: 10px; width: 100%; max-width: 400px; height: 250px;
}

.key {
  flex: 1; border-radius: 15px; cursor: pointer; transition: all 0.2s;
  opacity: 0.6; border-bottom: 8px solid rgba(0,0,0,0.3);
}
.key.active { opacity: 1; transform: translateY(5px); border-bottom-width: 2px; box-shadow: 0 0 40px currentColor; }

#k0 { background-color: #f87171; color: #f87171; }
#k1 { background-color: #fbbf24; color: #fbbf24; }
#k2 { background-color: #34d399; color: #34d399; }
#k3 { background-color: #60a5fa; color: #60a5fa; }

#screen-start, #screen-over {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(46, 16, 101, 0.98);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 30px; text-align: center;
}
.hidden { display: none !important; }
.btn {
  background: #c084fc; color: #2e1065; border: none; padding: 18px 50px;
  border-radius: 50px; font-size: 18px; font-weight: 900; cursor: pointer;
  margin-top: 25px;
}
#hint-text { margin-bottom: 30px; font-size: 20px; font-weight: bold; color: #e9d5ff; }
</style>
<script src="admob.js"></script>
</head>
<body>
<div id="app">
  <div id="header">
    <div class="stat"><span class="stat-lbl" id="lbl-best">BEST</span><br><span class="stat-val" id="best">0</span></div>
    <div class="stat"><span class="stat-lbl" id="lbl-score">SCORE</span><br><span class="stat-val" id="score">0</span></div>
    <div class="stat"><span class="stat-lbl" id="lbl-level">LEVEL</span><br><span class="stat-val" id="level">1</span></div>
  </div>
  <div id="arena">
    <div id="hint-text">Tayyorlaning...</div>
    <div id="piano">
      <div class="key" id="k0" onclick="playerTap(0)"></div>
      <div class="key" id="k1" onclick="playerTap(1)"></div>
      <div class="key" id="k2" onclick="playerTap(2)"></div>
      <div class="key" id="k3" onclick="playerTap(3)"></div>
    </div>
  </div>
</div>

<div id="screen-start">
  <div style="font-size: 80px">🎵</div>
  <h1 id="start-title">Melody Memory</h1>
  <p id="start-desc">Ovozlar ketma-ketligini eslab qoling va qaytaring!</p>
  <button class="btn" onclick="startGame()" id="btn-start">START</button>
</div>

<div id="screen-over" class="hidden">
  <h1 id="over-title">O'yin Tugadi</h1>
  <div style="font-size: 60px; margin: 20px 0; color: #c084fc" id="final-score">0</div>
  <button class="btn" onclick="startGame()" id="btn-again">TRY AGAIN</button>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const LANG = (params.get('lang') || 'uz').toLowerCase();
const I18N = {
  uz: { best:"REKORD", score:"BALL", level:"DARAJA", start:"Melodiya Xotira", desc:"Ovozlar ketma-ketligini eslab qoling va takrorlang!", btnStart:"BOSHLASH", btnAgain:"QAYTA O'YNASH", over:"O'yin Tugadi", listen:"Eshiting...", play:"Sizning navbatingiz!" },
  ru: { best:"РЕКОРД", score:"СЧЕТ", level:"УРОВЕНЬ", start:"Память Мелодий", desc:"Запомни последовательность звуков и повтори ее!", btnStart:"СТАРТ", btnAgain:"ЗАНОВО", over:"Игра Окончена", listen:"Слушай...", play:"Твой черед!" },
  en: { best:"BEST", score:"SCORE", level:"LEVEL", start:"Melody Memory", desc:"Remember the sound sequence and repeat it!", btnStart:"START", btnAgain:"PLAY AGAIN", over:"Game Over", listen:"Listen...", play:"Your turn!" }
};
const t = I18N[LANG] || I18N.en;

document.getElementById('lbl-best').textContent = t.best;
document.getElementById('lbl-score').textContent = t.score;
document.getElementById('lbl-level').textContent = t.level;
document.getElementById('start-title').textContent = t.start;
document.getElementById('start-desc').textContent = t.desc;
document.getElementById('btn-start').textContent = t.btnStart;
document.getElementById('btn-again').textContent = t.btnAgain;
document.getElementById('over-title').textContent = t.over;

let sequence = [], playerSeq = [], gameActive = false, score = 0;
let best = parseInt(localStorage.getItem('gz-best-melody-memory') || '0');
document.getElementById('best').textContent = best;

let audioCtx = null;
const FREQS = [261.63, 293.66, 329.63, 349.23]; // C4, D4, E4, F4

function playNote(freq) {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.5);
}

function startGame() {
  sequence = []; score = 0; gameActive = true;
  document.getElementById('score').textContent = "0";
  document.getElementById('screen-start').classList.add('hidden');
  document.getElementById('screen-over').classList.add('hidden');
  nextLevel();
}

function nextLevel() {
  playerSeq = [];
  sequence.push(Math.floor(Math.random() * 4));
  document.getElementById('level').textContent = sequence.length;
  playSequence();
}

async function playSequence() {
  gameActive = false;
  document.getElementById('hint-text').textContent = t.listen;
  for (let i = 0; i < sequence.length; i++) {
    await wait(300);
    activateKey(sequence[i]);
    await wait(600);
  }
  document.getElementById('hint-text').textContent = t.play;
  gameActive = true;
}

function activateKey(id) {
  const el = document.getElementById('k' + id);
  el.classList.add('active');
  playNote(FREQS[id]);
  setTimeout(() => el.classList.remove('active'), 400);
}

function playerTap(id) {
  if (!gameActive) return;
  activateKey(id);
  playerSeq.push(id);

  const step = playerSeq.length - 1;
  if (playerSeq[step] !== sequence[step]) {
    endGame();
    return;
  }

  if (playerSeq.length === sequence.length) {
    score += 10 * sequence.length;
    document.getElementById('score').textContent = score;
    setTimeout(nextLevel, 1000);
  }
}

function endGame() {
  gameActive = false;
  document.getElementById('final-score').textContent = score;
  document.getElementById('screen-over').classList.remove('hidden');
  if (score > best) {
    best = score;
    localStorage.setItem('gz-best-melody-memory', best);
    document.getElementById('best').textContent = best;
  }
  window.parent.postMessage({ type: "game:score", id: "melody-memory", score: score }, "*");
  window.parent.__gameEnd?.();
}

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }
</script>
</body>
</html>
