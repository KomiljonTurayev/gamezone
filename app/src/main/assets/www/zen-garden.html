<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zen Garden</title>
    <style>
        body { margin: 0; overflow: hidden; background: #001808; font-family: sans-serif; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui { position: fixed; bottom: 20px; width: 100%; text-align: center; color: rgba(255,255,255,0.5); font-size: 14px; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui"></div>
    <canvas id="canvas"></canvas>

    <script src="game-api.js"></script>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let drawing = false;
        let active = true;
        let strokeCount = 0;

        const I18N = {
            uz: { hint: "Qumda chiroyli naqshlar chizing 🌸" },
            ru: { hint: "Рисуйте красивые узоры на песке 🌸" },
            en: { hint: "Draw beautiful patterns on the sand 🌸" }
        };
        const t = GameAPI.t.bind(GameAPI, I18N);
        document.getElementById('ui').textContent = t('hint');

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            // Draw sand texture
            ctx.fillStyle = '#c2b280';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for(let i=0; i<5000; i++) {
                ctx.fillStyle = 'rgba(0,0,0,0.05)';
                ctx.fillRect(Math.random()*canvas.width, Math.random()*canvas.height, 1, 1);
            }
        }

        window.addEventListener('resize', init);

        function draw(x, y) {
            if (!drawing || !active) return;
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, 15, 0, Math.PI * 2);
            ctx.fill();

            ctx.globalCompositeOperation = 'source-over';
            ctx.strokeStyle = 'rgba(0,0,0,0.1)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(x, y, 16, 0, Math.PI * 2);
            ctx.stroke();

            if (Math.random() < 0.1) GameAPI.vibrate(5);
        }

        window.addEventListener('touchstart', e => {
            e.preventDefault();
            drawing = true;
            strokeCount++;
            draw(e.touches[0].clientX, e.touches[0].clientY);
        });
        window.addEventListener('touchmove', e => {
            e.preventDefault();
            draw(e.touches[0].clientX, e.touches[0].clientY);
        });
        window.addEventListener('touchend', () => drawing = false);

        window.addEventListener('mousedown', e => { drawing = true; strokeCount++; draw(e.clientX, e.clientY); });
        window.addEventListener('mousemove', e => { draw(e.clientX, e.clientY); });
        window.addEventListener('mouseup', () => drawing = false);

        window.addEventListener('gameDispose', () => {
            active = false;
            GameAPI.reportScore('zen-garden', strokeCount);
            GameAPI.saveBestScore('zen-garden', strokeCount);
            GameAPI.endGame();
        });

        init();
    </script>
</body>
</html>
